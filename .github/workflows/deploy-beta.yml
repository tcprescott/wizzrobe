name: Deploy beta

# The beta stack (deploy/beta/): the new app and the backend on seeded test
# data, with SANDBOX_MODE so nothing reaches a real person. Every push to main
# rebuilds both images and the self-hosted runner on the server restarts the
# stack; the Run workflow button deploys any branch by hand. Production is not
# touched: it still deploys by git pull + restart.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The newest push wins; a half-finished older deploy has nothing worth keeping.
concurrency:
  group: deploy-beta
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}
  APP_IMAGE: ghcr.io/${{ github.repository }}-app
  DOOR_RANDO_IMAGE: ghcr.io/${{ github.repository }}-door-rando
  # Repository variables (Settings → Secrets and variables → Actions → Variables).
  BETA_API_ORIGIN: ${{ vars.BETA_API_ORIGIN || 'https://wizzrobe-beta-api.synack.live' }}

jobs:
  build:
    if: github.repository == 'tcprescott/wizzrobe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read commit date
        id: commit
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_IMAGE }}:beta
            ${{ env.API_IMAGE }}:beta-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_COMMIT_DATE=${{ steps.commit.outputs.date }}
          cache-from: type=gha,scope=beta-api
          cache-to: type=gha,mode=max,scope=beta-api

      - name: Build and push the Door Randomizer sidecar
        uses: docker/build-push-action@v6
        with:
          context: sidecars/door_rando
          push: true
          tags: |
            ${{ env.DOOR_RANDO_IMAGE }}:beta
            ${{ env.DOOR_RANDO_IMAGE }}:beta-${{ github.sha }}
          cache-from: type=gha,scope=beta-door-rando
          cache-to: type=gha,mode=max,scope=beta-door-rando

      - name: Build and push the new app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:beta
            ${{ env.APP_IMAGE }}:beta-${{ github.sha }}
          build-args: |
            VITE_API_BASE=${{ env.BETA_API_ORIGIN }}
            VITE_AUTH_ORIGIN=${{ env.BETA_API_ORIGIN }}
          cache-from: type=gha,scope=beta-app
          cache-to: type=gha,mode=max,scope=beta-app

  deploy:
    needs: build
    # Only the runner registered on the server carries this label.
    runs-on: [self-hosted, wizzrobe-beta]
    timeout-minutes: 20
    environment: beta
    permissions:
      contents: read
      packages: read
    env:
      STACK_DIR: ${{ vars.BETA_STACK_DIR || '/opt/wizzrobe-beta' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/beta
          sparse-checkout-cone-mode: false

      - name: Check the stack folder
        run: |
          test -f "$STACK_DIR/beta.env" || {
            echo "::error::$STACK_DIR/beta.env is missing; copy deploy/beta/beta.env.example there and fill it in."
            exit 1
          }
          cp deploy/beta/docker-compose.yml "$STACK_DIR/docker-compose.yml"

      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and restart
        working-directory: ${{ env.STACK_DIR }}
        run: |
          docker compose pull
          docker compose up -d --remove-orphans --wait --wait-timeout 300

      - name: Seed test data
        # Idempotent: adds whatever a new feature's seed brings, leaves the rest.
        working-directory: ${{ env.STACK_DIR }}
        run: docker compose exec -T api python scripts/seed_dev.py

      - name: Tidy up
        if: always()
        run: |
          docker logout ghcr.io || true
          docker image prune -f
