name: Tests

# Pull requests and pushes to main run this directly. publish.yml also calls it
# through `workflow_call` to gate a container build on the same suite; that
# workflow is paused (manual runs only), so main gets its run from `push` here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# `github.workflow` is the *caller's* name inside a reusable workflow, so a PR
# run and the publish.yml run of the same suite never share a group.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so a Poetry release cannot break every job at once. Bump deliberately.
  POETRY_VERSION: '2.3.3'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff (blocking)
        run: poetry run ruff check .

      # Blocking, but as a ratchet: existing debt is baselined per file and only
      # a file that *gains* errors fails. See scripts/mypy_ratchet.py.
      - name: Mypy (ratchet)
        run: poetry run python scripts/mypy_ratchet.py

  guardrails:
    # The checks in .claude/scripts/ encode the invariants CLAUDE.md states —
    # layer boundaries, tenant scoping, async and datetime safety, feature-flag
    # gating, audit discipline. As Claude Code hooks they only fire inside a
    # Claude session; here they bind every commit, whoever wrote it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The runner diffs against the merge base, so it needs the history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Stdlib only — the checks import nothing outside the standard library,
      # so this job skips the Poetry install the other jobs need.
      - name: Guardrails (changed files)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          python scripts/guardrails.py --changed "$base"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest (with coverage report)
        run: poetry run pytest -q --cov=application --cov=api --cov=middleware --cov-report=term-missing

  changes:
    # Decides which subsystem-only jobs a PR needs. A job skipped by its `if:`
    # reports as passed, so a required check never waits on it. Everything that
    # isn't a pull request (a push to main, a manual run) runs all.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swiss: ${{ steps.diff.outputs.swiss }}
      postgres: ${{ steps.diff.outputs.postgres }}
      a11y: ${{ steps.diff.outputs.a11y }}
      web: ${{ steps.diff.outputs.web }}
      api_schema: ${{ steps.diff.outputs.api_schema }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changed paths
        id: diff
        # Fails open: a diff that errors or comes back empty runs every job, so
        # a broken `changes` job can never turn a skipped check into a green one.
        run: |
          run_all() {
            for job in swiss postgres a11y web api_schema; do echo "$job=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }
          [ "${{ github.event_name }}" = "pull_request" ] || run_all
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD") || run_all
          [ -n "$files" ] || run_all

          # touches <regex>: true when any changed path matches.
          touches() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          # only <regex>: true when every changed path matches.
          only() { echo "$files" | grep -qvE "$1" && echo false || echo true; }

          {
            echo "swiss=$(touches '^(application/services/bracket_engines/|tests/services/test_bracket_swiss_crossvalidation\.py$|tests/services/_trf\.py$|poetry\.lock$|\.github/workflows/test\.yml$)')"

            # The tenancy suite reaches services, the API, MCP and middleware, so
            # PostgreSQL skips only when nothing but UI, help and event-info
            # content, docs, change notes or UI tests moved. pytest still runs the same tests on SQLite either way.
            if [ "$(only '^(web/|pages/|theme/|static/|docs/|\.claude/|application/(changelog|help|event_info)/|tests/(theme|pages)/|scripts/(ui_[^/]*|help_screenshots/.*)$|[^/]+\.md$)')" = true ]; then
              echo "postgres=false"
            else
              echo "postgres=true"
            fi

            # Markup and colour live in the UI layers and the content the pages
            # render; a backend-only PR changes neither. Change notes are left
            # out because nearly every PR adds one.
            echo "a11y=$(touches '^(pages/|theme/|static/|application/(help|content|about|event_info)/|scripts/ui_|scripts/seed_dev\.py$|main\.py$|middleware/|poetry\.lock$|pyproject\.toml$|\.github/)')"

            # The new app (web/). Its typed client is generated from the REST
            # schema, so anything that can change a route or a response model
            # re-checks the committed copy.
            echo "web=$(touches '^(web/|\.github/)')"
            echo "api_schema=$(touches '^(api/|application/|models/|web/|scripts/export_openapi\.py$|poetry\.lock$|pyproject\.toml$|\.github/)')"
          } >> "$GITHUB_OUTPUT"

  web:
    # The new app in web/ (docs/specs/mobile-app.md): typecheck, unit tests,
    # build, then axe + contrast + phone overflow on every screen in light and
    # dark against stubbed API fixtures, so no backend is booted.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility and contrast (light and dark, phone and desktop)
        env:
          A11Y_WIDTHS: ${{ github.event_name == 'pull_request' && '360' || '360,393,412,440' }}
        run: npm run a11y

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-a11y-screenshots
          path: web/a11y-report/
          if-no-files-found: warn

  web-api-client:
    # web/src/api/schema.d.ts is generated from the REST schema. A route or
    # response model change without `npm run gen:api` fails here.
    needs: changes
    if: needs.changes.outputs.api_schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate the schema and the client
        run: |
          poetry run python scripts/export_openapi.py web/openapi.json
          cd web && npm ci && npm run gen:api

      - name: Committed copy matches
        run: |
          if ! git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts; then
            echo "::error::The REST schema changed. Run: poetry run python scripts/export_openapi.py && (cd web && npm run gen:api), and commit both files."
            exit 1
          fi

  swiss-crossvalidation:
    # Cross-validate our Swiss engine against bbpPairings (a real FIDE-grade
    # Dutch engine). Nothing outside the Swiss engine can change its pairings,
    # so a PR runs this only when the engine, the test or its pins change.
    needs: changes
    if: needs.changes.outputs.swiss == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned to a commit rather than tracking master: an upstream push would
      # otherwise change what we cross-validate against, mid-PR and unannounced.
      BBPPAIRINGS_REF: 8f9e3c5ffdc4d7a08a33d31c6fb49b4e7acef4d5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Build bbpPairings
        run: |
          git init bbpPairings
          git -C bbpPairings remote add origin https://github.com/BieremaBoyzProgramming/bbpPairings
          git -C bbpPairings fetch --depth 1 origin "$BBPPAIRINGS_REF"
          git -C bbpPairings checkout FETCH_HEAD
          make -C bbpPairings

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Swiss cross-validation tests
        env:
          BBPPAIRINGS_BIN: ${{ github.workspace }}/bbpPairings/bbpPairings.exe
        run: poetry run pytest tests/services/test_bracket_swiss_crossvalidation.py -q

  postgres:
    # The suite runs on SQLite, where some of what production relies on is a
    # silent no-op — SELECT ... FOR UPDATE most of all. This lane re-runs the
    # tests whose meaning depends on the real backend: the row-locking tests
    # (which fail here if the lock is removed, and cannot on SQLite) and the
    # tenant-isolation suite, which is the one that leans on real constraint
    # enforcement. Serial: each test drops and recreates the schema, so parallel
    # workers would pull the tables out from under each other. A PR that only
    # touches UI or docs skips it (see `changes`).
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizzrobe
          POSTGRES_PASSWORD: wizzrobe
          POSTGRES_DB: wizzrobe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizzrobe -d wizzrobe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-full-3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Pytest (PostgreSQL backend)
        env:
          WIZZROBE_TEST_DB_URL: postgres://wizzrobe:wizzrobe@localhost:5432/wizzrobe_test
        run: poetry run pytest tests/postgres tests/tenancy -q -n0

  browser:
    # pages/ + theme/ are ~34k lines the pytest suite does not cover, and their
    # Vue/Quasar slot templates run client-side: a bad `props.row.foo` in a table
    # slot renders a blank cell that no Python test can see. This job boots the
    # real app against a real PostgreSQL, seeds it, and walks the surfaces where
    # a blank render would cost the most — the short CI cousin of the full
    # /ui-validation loop, which stays a local tool. The a11y scan runs in
    # `browser-a11y` against its own app: the app is single-worker, so the two
    # halves only overlap when each has one.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizzrobe
          POSTGRES_PASSWORD: wizzrobe
          POSTGRES_DB: wizzrobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizzrobe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: wizzrobe
      DB_USERNAME: wizzrobe
      DB_PASSWORD: wizzrobe
      DB_HOST: localhost
      DB_PORT: 5432
      ENVIRONMENT: development
      # Every outbound integration is mocked: this job proves pages render, and
      # it must not depend on Discord, a randomizer, Challonge, Twitch or
      # racetime.gg being reachable from a CI runner.
      MOCK_DISCORD: 'true'
      MOCK_SEEDGEN: 'true'
      MOCK_CHALLONGE: 'true'
      MOCK_TWITCH: 'true'
      MOCK_RACETIME: 'true'
      # Installs the redraw hook scripts/ui_layout_shift.js drives
      # (theme/layout_probe.py). Never set in production.
      WIZ_LAYOUT_PROBE: 'true'
      # SIGUSR1 writes a memory census here, for scripts/ui_leak_check.js.
      # Never set in production.
      MEMORY_CENSUS_DUMP: /tmp/census.json
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/boot-app
        with:
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Walk the surfaces
        run: node scripts/ui_smoke.js scripts/ui_smoke_ci.json

      - name: Closed tabs are let go
        # Opens and closes every page three times and fails if dead pages pile
        # up in server memory, naming what holds them (SGLMAN-29). Main only:
        # it was a third of this job, the job every PR waits on, and leaks are
        # rare enough that a red main run right after the merge is soon enough.
        if: github.event_name != 'pull_request'
        run: node scripts/ui_leak_check.js scripts/ui_a11y_ci.json

      - name: Layout holds still (desktop and phone)
        # Redraws every live section with unchanged data and fails anything that
        # moves. docs/style-guide.md#hold-still says how to fix a failure.
        run: node scripts/ui_layout_shift.js scripts/ui_layout_shift_ci.json

      - name: Back, Forward, reload and deep links
        # Every view switch must move the address bar and title with it
        # (theme/url_state.py); this clicks, goes Back and Forward, reloads and
        # cold-loads links, on desktop and phone.
        run: node scripts/ui_history.js scripts/ui_history_ci.json

      - name: App log
        if: always()
        run: tail -200 /tmp/app.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: |
            /tmp/ui-smoke-ci/
            /tmp/ui-history-ci/
          if-no-files-found: warn

  browser-a11y:
    # A backend-only PR can't change markup or colour, so it skips the scan
    # (see `changes`). The smoke walk in `browser` still renders every page.
    needs: changes
    if: needs.changes.outputs.a11y == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizzrobe
          POSTGRES_PASSWORD: wizzrobe
          POSTGRES_DB: wizzrobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizzrobe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: wizzrobe
      DB_USERNAME: wizzrobe
      DB_PASSWORD: wizzrobe
      DB_HOST: localhost
      DB_PORT: 5432
      ENVIRONMENT: development
      # Every outbound integration is mocked: this job proves pages pass axe, and
      # it must not depend on Discord, a randomizer, Challonge, Twitch or
      # racetime.gg being reachable from a CI runner.
      MOCK_DISCORD: 'true'
      MOCK_SEEDGEN: 'true'
      MOCK_CHALLONGE: 'true'
      MOCK_TWITCH: 'true'
      MOCK_RACETIME: 'true'
      # Installs the redraw hook scripts/ui_layout_shift.js drives
      # (theme/layout_probe.py). Never set in production.
      WIZ_LAYOUT_PROBE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/boot-app
        with:
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Accessibility and contrast (light and dark)
        # axe WCAG 2.1 AA rules plus a tint-aware contrast check on every page in
        # scripts/ui_a11y_ci.json. docs/style-guide.md says how to fix a failure.
        # A pull request checks the 360px phone only, the narrowest and the one
        # that fails first; main checks all four.
        env:
          A11Y_PHONE_WIDTHS: ${{ github.event_name == 'pull_request' && '360' || '' }}
        run: node scripts/ui_a11y_scan.js scripts/ui_a11y_ci.json

      - name: App log
        if: always()
        run: tail -200 /tmp/app.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-a11y-screenshots
          path: /tmp/ui-smoke-ci/a11y/
          if-no-files-found: warn
