[tool.poetry]
name = "wizzrobe"
version = "0.1.0"
description = ""
authors = ["Thomas Prescott <tcprescott@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
nicegui = "^3.12.1"
fastapi = ">=0.136,<0.143"
pyyaml = "^6.0.2"
asyncpg = "^0.31.0"
tortoise-orm = {extras = ["asyncpg"], version = ">=0.24,<0.26"}
aerich = {extras = ["toml"], version = ">=0.8.1,<0.10.0"}
cryptography = "^50.0.0"
zenora = "^0.0.3.post1"
python-dotenv = "^1.1.1"
discord-py = "^2.7.1"
pyz3r = "^6.1.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.62.0"}
qrcode = {extras = ["pil"], version = "^8.2"}
pillow = ">=12.3,<14.0"
httpx = "^0.28.0"
swisspair = "^0.2.1"
mcp = ">=1.28.1,<3.0.0"
redis = ">=6,<9"
resvg-py = "^0.5.0"



[tool.poetry.group.dev.dependencies]
ipython = "^9.0.0"
pytest = "^9.0"
pytest-asyncio = "^1.0"
pytest-mock = "^3.14"
ruff = ">=0.9,<0.17"
mypy = ">=1.14,<3.0"
aiosqlite = ">=0.21,<0.23"
pytest-cov = ">=6,<8"
pytest-xdist = "^3.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run across all cores by default — the suite is ~3200 mostly-independent tests
# and wall time is what limits how many more we can add. ``loadfile`` keeps each
# module on a single worker, so module-level state stays as contained as it is
# in a serial run. Override with ``-n0`` for a serial run when you need ``-s``,
# a debugger, or readable live output from one file.
addopts = "-n auto --dist loadfile"

[tool.ruff]
line-length = 120
target-version = "py312"
# Migrations are hand-written SQL-in-strings, not style-maintained.
extend-exclude = ["migrations"]

[tool.ruff.lint]
# F/E9  — real bugs: unused imports/vars, undefined names, runtime syntax errors.
# ASYNC — the "never block the event loop" rule from CLAUDE.md, enforced
#         mechanically instead of by convention plus an editor-time hook.
# B     — bugbear: mutable defaults, un-chained re-raises, silent zip truncation.
# I     — import order, so it stops being a review topic.
# RUF   — ruff's own checks: implicit Optional, mutable class defaults, dead noqa.
#
# Deliberately NOT enabled: UP (pyupgrade). It is ~3.7k findings of pure style
# (`Optional[X]` → `X | None`, `Dict` → `dict`), which would rewrite most of the
# tree for no behavioural gain and bury the next real diff.
select = ["F", "E9", "ASYNC", "B", "I", "RUF"]
ignore = [
    # FastAPI's whole idiom is `x = Depends(...)` / `Query(...)` in a default.
    "B008",
    # The prose uses em-dashes and arrows on purpose; these flag them as
    # confusable Unicode in strings, docstrings and comments.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# `tenant, user = await make_fixture()` is the suite's idiom; underscoring the
# half a given test ignores would churn ~160 lines for no behavioural gain.
"tests/**" = ["RUF059"]
# One-shot CLIs run on their own loop, so a blocking file read stalls nobody.
"scripts/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
exclude = ["migrations/", "tests/"]

[tool.aerich]
tortoise_orm = "migrations.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
